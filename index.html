<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>BUSCAR CEP </title>
</head>
<body>
    <div class="container-fluid">
        <div class="form-group">
            <span>CEP</span>
            <input type="text" name="edtCEP" id="edtCEP" class="form-control">
        </div>

        <div class="form-group">
            <span>ENDRECO</span>
            <input type="text" name="edtCEP" id="edtENDRECO" class="form-control">
        </div>

        <div class="form-group">
            <span>NUMERO</span>
            <input type="text" name="edtCEP" id="edtNUMERO" class="form-control">
        </div>

        <div class="form-group">
            <span>CIDADE</span>
            <input type="text" name="edtCEP" id="edtCIDADE" class="form-control">
        </div>

        <div class="form-group">
            <span>ESTADO</span>
            <input type="text" name="edtCEP" id="edtESTADO" class="form-control">
        </div>
        <button class="btn btn-outline-dark mt-2" onclick="buscaCEP()">BUSCAR CEP</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
